<!doctype html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="حساب کاربری Web 2 — داشبورد گیمرینگ با آمار خرید و سفارشات">
    <meta name="theme-color" content="#050816">
    <meta name="color-scheme" content="dark light">
    <title>حساب کاربری | Web 2 Gaming Store</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        /* ===== Profile Page Specific Styles ===== */
        .profile-page {
            min-height: calc(100vh - 78px);
            padding-block: 50px 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .profile-page .container {
            width: min(calc(100% - 40px), 800px);
        }

        /* --- Auth Form (not logged in) --- */
        .profile-auth-card {
            max-width: 480px;
            margin: 0 auto;
            padding: 40px 34px;
            border: 1px solid var(--line);
            border-radius: var(--radius-lg);
            background: var(--surface);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            box-shadow: var(--shadow), 0 0 60px rgba(139, 92, 246, 0.08);
            text-align: center;
        }
        .profile-auth-card .auth-brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
            color: var(--cyan);
            font-size: 1.6rem;
            font-weight: 900;
        }
        .profile-auth-card .auth-brand i {
            font-size: 1.8rem;
            filter: drop-shadow(0 0 12px rgba(0, 212, 255, 0.4));
        }
        .profile-auth-card h1 {
            margin: 6px 0 4px;
            font-size: 1.6rem;
        }
        .profile-auth-card .auth-sub {
            color: var(--text-soft);
            font-size: 0.88rem;
            margin-bottom: 28px;
        }
        .profile-auth-card .field-group {
            display: flex;
            flex-direction: column;
            gap: 18px;
            margin-bottom: 24px;
            text-align: right;
        }
        .profile-auth-card .field-group label {
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-soft);
        }
        .profile-auth-card .field-group label span {
            display: block;
            margin-bottom: 6px;
        }
        .profile-auth-card .field-group input {
            width: 100%;
            padding: 13px 16px;
            border: 1px solid var(--line);
            border-radius: var(--radius-sm);
            background: rgba(0,0,0,0.25);
            color: var(--text);
            font-size: 0.95rem;
            transition: border-color 0.25s, box-shadow 0.25s;
        }
        .profile-auth-card .field-group input:focus {
            border-color: var(--cyan);
            box-shadow: 0 0 16px rgba(0, 212, 255, 0.15);
            outline: none;
        }
        .profile-auth-card .primary-button {
            width: 100%;
            justify-content: center;
            padding-block: 14px;
            font-size: 1rem;
        }

        /* --- Validation Error Messages --- */
        .profile-auth-card .field-error {
            display: none;
            margin-top: 6px;
            padding: 6px 12px;
            font-size: 0.78rem;
            font-weight: 500;
            color: #ff1744;
            text-shadow: 0 0 8px rgba(255, 23, 68, 0.6), 0 0 20px rgba(255, 23, 68, 0.3);
            background: rgba(255, 23, 68, 0.08);
            border: 1px solid rgba(255, 23, 68, 0.25);
            border-radius: 8px;
            text-align: right;
            direction: rtl;
            font-family: 'Vazirmatn', sans-serif;
            animation: error-fade-in 0.25s ease both;
        }
        .profile-auth-card .field-error.show {
            display: block;
        }
        .profile-auth-card .field-group input.input-error-border {
            border-color: #ff1744;
            box-shadow: 0 0 16px rgba(255, 23, 68, 0.2);
        }
        @keyframes error-fade-in {
            from { opacity: 0; transform: translateY(-4px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* --- Dashboard (logged in) --- */
        .profile-dashboard {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
        .profile-dashboard h1 {
            font-size: 1.35rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .profile-dashboard h1 i {
            color: var(--purple);
        }

        .profile-cards {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .profile-card {
            padding: 26px 24px;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: var(--surface);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: var(--shadow);
            transition: transform 0.25s, box-shadow 0.25s;
        }
        .profile-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow), 0 0 30px rgba(139, 92, 246, 0.06);
        }
        .profile-card.full-width {
            grid-column: 1 / -1;
        }

        /* Avatar card */
        .profile-avatar-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 6px;
        }
        .profile-avatar-ring {
            width: 96px;
            height: 96px;
            margin-bottom: 10px;
            display: grid;
            place-items: center;
            border: 3px solid var(--cyan);
            border-radius: 50%;
            background: linear-gradient(145deg, rgba(0, 212, 255, 0.12), rgba(139, 92, 246, 0.12));
            color: var(--cyan);
            font-size: 2.6rem;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.2);
        }
        .profile-avatar-card h2 {
            font-size: 1.3rem;
        }
        .profile-avatar-card .join-date {
            color: var(--text-soft);
            font-size: 0.75rem;
        }

        /* Contact card */
        .profile-contact-card {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .profile-contact-card h3 {
            font-size: 0.9rem;
            color: var(--text-soft);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .profile-contact-card h3 i {
            color: var(--purple);
        }
        .profile-contact-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            background: rgba(0,0,0,0.15);
            font-size: 0.88rem;
        }
        .profile-contact-item i {
            width: 20px;
            color: var(--cyan);
        }

        /* Stats card */
        .profile-stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .profile-stat-box {
            padding: 20px 16px;
            border-radius: var(--radius-sm);
            background: rgba(0,0,0,0.15);
            text-align: center;
        }
        .profile-stat-box .stat-value {
            font-size: 1.8rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--cyan), var(--purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .profile-stat-box .stat-label {
            display: block;
            margin-top: 4px;
            color: var(--text-soft);
            font-size: 0.78rem;
        }
        .profile-stat-box .stat-icon {
            font-size: 1.4rem;
            color: var(--purple);
            margin-bottom: 6px;
        }

        /* Orders history */
        .profile-orders-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .profile-order-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            border: 1px solid var(--line);
            border-radius: var(--radius-sm);
            background: rgba(0,0,0,0.12);
            font-size: 0.85rem;
            gap: 12px;
        }
        .profile-order-item .order-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .profile-order-item .order-info strong {
            font-size: 0.95rem;
        }
        .profile-order-item .order-info small {
            color: var(--text-soft);
            font-size: 0.72rem;
        }
        .profile-order-item .order-amount {
            font-weight: 700;
            color: var(--green);
            white-space: nowrap;
        }
        .profile-order-empty {
            color: var(--text-soft);
            text-align: center;
            padding: 30px 0;
        }
        .profile-order-empty i {
            font-size: 2rem;
            color: var(--purple);
            margin-bottom: 10px;
        }

        /* Action buttons */
        .profile-actions {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            grid-column: 1 / -1;
        }
        .profile-actions .primary-button,
        .profile-actions .secondary-button {
            flex: 1;
            justify-content: center;
            min-width: 140px;
        }
        .logout-danger {
            border-color: var(--danger) !important;
            color: var(--danger) !important;
            box-shadow: 0 0 14px rgba(255, 77, 109, 0.15) !important;
        }
        .logout-danger:hover {
            background: rgba(255, 77, 109, 0.12) !important;
            border-color: var(--danger) !important;
            box-shadow: 0 0 24px rgba(255, 77, 109, 0.3) !important;
        }
        .logout-danger i {
            color: var(--danger) !important;
        }

        /* Toast */
        .profile-toast {
            position: fixed;
            z-index: 9999;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 14px 28px;
            border-radius: var(--radius-sm);
            background: var(--surface-solid);
            border: 1px solid var(--line);
            color: var(--text);
            font-size: 0.9rem;
            box-shadow: var(--shadow), 0 0 30px rgba(139, 92, 246, 0.1);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            opacity: 0;
            transition: opacity 0.4s, transform 0.4s;
            pointer-events: none;
        }
        .profile-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(-10px);
        }

        @media (max-width: 640px) {
            .profile-cards {
                grid-template-columns: 1fr;
            }
            .profile-auth-card {
                padding: 30px 20px;
            }
            .profile-stats-grid {
                grid-template-columns: 1fr;
            }
            .profile-actions {
                flex-direction: column;
            }
        }
    </style>
</head>
<body data-page="profile">
    <header class="site-header">
        <div class="container header-inner">
            <a class="brand" href="index.html" aria-label="صفحه اصلی Web 2">
                <span class="brand-icon"><i class="fa-solid fa-gamepad" aria-hidden="true"></i></span>
                <span><strong>WEB 2</strong><small>GAMING STORE</small></span>
            </a>
            <nav class="main-nav" aria-label="ناوبری اصلی">
                <a href="index.html">خانه</a>
                <a href="index.html#products">محصولات</a>
                <a href="cart.html">سبد خرید</a>
                <a class="active" href="profile.html" aria-current="page">حساب کاربری</a>
            </nav>
        </div>
    </header>

    <main class="profile-page">
        <div class="container" id="profileApp">
            <!-- content injected by JS -->
        </div>
    </main>

    <div class="profile-toast" id="profileToast"></div>

    <script>
        "use strict";

        const PROFILE_USER_KEY = "gp_user";
        const PROFILE_ORDERS_KEY = "web2_orders";

        /* ---------- helpers ---------- */
        function escapeHTML(value) {
            if (typeof value !== "string") return "";
            const map = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
            return value.replace(/[&<>"']/g, (ch) => map[ch]);
        }

        function formatNumber(value) {
            if (value == null) return "۰";
            return new Intl.NumberFormat("fa-IR").format(Number(value));
        }

        function formatPrice(value) {
            return formatNumber(value) + " تومان";
        }

        function getCurrentUser() {
            try { return JSON.parse(localStorage.getItem(PROFILE_USER_KEY) || "null"); } catch { return null; }
        }

        function saveCurrentUser(user) {
            localStorage.setItem(PROFILE_USER_KEY, JSON.stringify(user));
        }

        function getOrders() {
            try { return JSON.parse(localStorage.getItem(PROFILE_ORDERS_KEY) || "[]"); } catch { return []; }
        }

        function showToast(msg) {
            const el = document.getElementById("profileToast");
            if (!el) return;
            el.textContent = msg;
            el.classList.add("show");
            clearTimeout(el._timer);
            el._timer = setTimeout(() => el.classList.remove("show"), 3500);
        }

        /* ---------- format date ---------- */
        function formatDate(iso) {
            try {
                return new Intl.DateTimeFormat("fa-IR", { dateStyle: "long" }).format(new Date(iso));
            } catch { return iso || "—"; }
        }

        /* ---------- render ---------- */
        function renderProfile() {
            const app = document.getElementById("profileApp");
            if (!app) return;
            const user = getCurrentUser();

            if (!user) {
                /* ---- not logged in: show auth form ---- */
                app.innerHTML = `
                    <div class="profile-auth-card glass-panel">
                        <div class="auth-brand"><i class="fa-solid fa-gamepad"></i><span>WEB 2</span></div>
                        <h1>ورود / ثبت‌نام</h1>
                        <p class="auth-sub">برای دسترسی به داشبورد و خریدهای خود وارد شوید</p>
                        <form id="profileAuthForm">
                            <div class="field-group">
                                <label><span>نام و نام‌خانوادگی</span>
                                    <input type="text" name="name" required minlength="2" maxlength="60" autocomplete="name" placeholder="مثلاً امیرحسین رضایی">
                                </label>
                                <label><span>ایمیل</span>
                                    <input type="email" name="email" required maxlength="50" autocomplete="email" placeholder="name@example.com">
                                    <div class="field-error" id="emailError"></div>
                                </label>
                                <label><span>رمز عبور</span>
                                    <input type="password" name="password" required minlength="4" placeholder="رمز عبور (حداقل ۴ کاراکتر)">
                                    <div class="field-error" id="passwordError"></div>
                                </label>
                            </div>
                            <button class="primary-button" type="submit">ورود / ساخت حساب <i class="fa-solid fa-arrow-left"></i></button>
                        </form>
                        <p style="margin-top:20px;font-size:0.75rem;color:var(--text-soft);">
                            <i class="fa-solid fa-shield-halved"></i> اطلاعات شما به صورت امن در مرورگر ذخیره می‌شود
                        </p>
                    </div>
                `;

                document.getElementById("profileAuthForm").addEventListener("submit", function (e) {
                    e.preventDefault();

                    // Clear previous errors
                    document.querySelectorAll(".profile-auth-card .field-error").forEach(el => {
                        el.classList.remove("show");
                        el.textContent = "";
                    });
                    document.querySelectorAll(".profile-auth-card .field-group input").forEach(el => {
                        el.classList.remove("input-error-border");
                    });

                    const data = new FormData(e.currentTarget);
                    const email = data.get("email").trim();
                    const password = data.get("password").trim();
                    let hasError = false;

                    // Validate password length
                    if (password.length < 4) {
                        document.getElementById("passwordError").textContent = "رمز عبور باید حداقل ۴ کاراکتر باشد!";
                        document.getElementById("passwordError").classList.add("show");
                        document.querySelector("input[name='password']").classList.add("input-error-border");
                        hasError = true;
                    }

                    // Validate email format
                    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                      if (!emailRegex.test(email)) {
                        document.getElementById("emailError").textContent = "لطفاً یک ایمیل معتبر وارد کنید.";
                          document.getElementById("emailError").classList.add("show");
                          document.querySelector("input[name='email']").classList.add("input-error-border");
                          hasError = true;
                    }

                    if (hasError) return;

                    const userData = {
                        name: data.get("name").trim(),
                        phone: email,
                        password: password,
                        orderCount: 0,
                        totalSpent: 0,
                        joinDate: new Date().toISOString()
                    };
                    saveCurrentUser(userData);
                    showToast("خوش آمدید! حساب شما ساخته شد.");
                    renderProfile();
                });
                return;
            }

            /* ---- logged in: dashboard ---- */
            const orders = getOrders();
            const userOrders = orders.filter(o => o.userPhone === user.phone);
            const orderCount = userOrders.length;
            const totalSpent = userOrders.reduce((sum, o) => sum + (Number(o.amount) || 0), 0);

            const recentOrders = userOrders.slice(-5).reverse();

            app.innerHTML = `
                <div class="profile-dashboard">
                    <h1><i class="fa-solid fa-gamepad"></i> داشبورد گیمر</h1>

                    <div class="profile-cards">
                        <!-- Avatar & Name -->
                        <div class="profile-card profile-avatar-card">
                            <div class="profile-avatar-ring"><i class="fa-solid fa-user-astronaut"></i></div>
                            <h2>${escapeHTML(user.name)}</h2>
                            <span class="join-date"><i class="fa-regular fa-calendar"></i> عضو از ${formatDate(user.joinDate)}</span>
                        </div>

                        <!-- Contact Info -->
                        <div class="profile-card profile-contact-card">
                            <h3><i class="fa-solid fa-address-card"></i> اطلاعات تماس</h3>
                            <div class="profile-contact-item"><i class="fa-regular fa-user"></i> ${escapeHTML(user.name)}</div>
                            <div class="profile-contact-item"><i class="fa-regular fa-envelope"></i> ${escapeHTML(user.phone)}</div>
                        </div>

                        <!-- Gamer Stats -->
                        <div class="profile-card full-width">
                            <h3 style="margin-bottom:16px;font-size:0.9rem;color:var(--text-soft);display:flex;align-items:center;gap:8px;">
                                <i class="fa-solid fa-chart-simple" style="color:var(--purple);"></i> آمار گیمری
                            </h3>
                            <div class="profile-stats-grid">
                                <div class="profile-stat-box">
                                    <div class="stat-icon"><i class="fa-solid fa-cart-shopping"></i></div>
                                    <div class="stat-value">${formatNumber(orderCount)}</div>
                                    <span class="stat-label">تعداد خریدهای موفق</span>
                                </div>
                                <div class="profile-stat-box">
                                    <div class="stat-icon"><i class="fa-solid fa-sack-dollar"></i></div>
                                    <div class="stat-value">${formatNumber(totalSpent)}</div>
                                    <span class="stat-label">مجموع خریدهای ثبت شده (تومان)</span>
                                </div>
                            </div>
                        </div>

                        <!-- Order History -->
                        <div class="profile-card full-width">
                            <h3 style="margin-bottom:16px;font-size:0.9rem;color:var(--text-soft);display:flex;align-items:center;gap:8px;">
                                <i class="fa-solid fa-clock-rotate-left" style="color:var(--cyan);"></i> تاریخچه سفارشات اخیر
                            </h3>
                            <div class="profile-orders-list" id="profileOrdersList">
                                ${recentOrders.length === 0 ? `
                                    <div class="profile-order-empty">
                                        <i class="fa-solid fa-bag-shopping"></i>
                                        <p>هنوز هیچ سفارشی ثبت نکرده‌اید.</p>
                                    </div>
                                ` : recentOrders.map(o => `
                                    <div class="profile-order-item">
                                        <div class="order-info">
                                            <strong>${escapeHTML(o.code || "—")}</strong>
                                            <small>${escapeHTML(o.date || "—")} · ${o.itemCount || 0} کالا</small>
                                        </div>
                                        <span class="order-amount">${formatPrice(o.amount || 0)}</span>
                                    </div>
                                `).join("")}
                            </div>
                        </div>

                        <!-- Actions -->
                        <div class="profile-actions">
                            <button class="primary-button" id="editProfileBtn" type="button"><i class="fa-solid fa-pen-to-square"></i> ویرایش اطلاعات</button>
                            <button class="secondary-button logout-danger" id="logoutProfileBtn" type="button"><i class="fa-solid fa-right-from-bracket"></i> خروج از حساب</button>
                        </div>
                    </div>
                </div>
            `;

            /* Edit button */
            document.getElementById("editProfileBtn").addEventListener("click", function () {
                const current = getCurrentUser();
                if (!current) return;
                const newName = prompt("نام جدید", current.name);
                if (!newName || newName.trim().length < 2) return;
                current.name = newName.trim();
                saveCurrentUser(current);
                showToast("اطلاعات با موفقیت ویرایش شد.");
                renderProfile();
            });

            /* Logout button */
            document.getElementById("logoutProfileBtn").addEventListener("click", function () {
                if (!confirm("آیا از خروج از حساب خود اطمینان دارید؟")) return;
                localStorage.removeItem(PROFILE_USER_KEY);
                showToast("از حساب خود خارج شدید.");
                renderProfile();
            });
        }

        /* ---------- init ---------- */
        document.addEventListener("DOMContentLoaded", renderProfile);
    </script>
</body>
</html>
